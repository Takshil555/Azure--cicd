name: CI/CD Pipeline - Build & Deploy API Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_REPO_NAME }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vm:
    name: Deploy Container to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Azure VM and Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_ACR_USERNAME: ${{ secrets.AZURE_ACR_USERNAME }}
          AZURE_ACR_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}
          AZURE_REPO_NAME: ${{ secrets.AZURE_REPO_NAME }}
          AZURE_VM_USERNAME: ${{ secrets.AZURE_VM_USERNAME }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          envs: AZURE_ACR_NAME,AZURE_ACR_USERNAME,AZURE_ACR_PASSWORD,AZURE_REPO_NAME,AZURE_VM_USERNAME
          script_stop: true
          script: |
            set -e

            echo "=== Step 1: Checking Docker & Docker Compose Installation ==="
            if ! command -v docker &> /dev/null; then
              echo "Docker is not installed. Installing Docker on Ubuntu 24.04 LTS..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER || true
              sudo systemctl enable docker
              sudo systemctl start docker
              echo "Docker installed successfully."
            else
              echo "Docker is already installed."
            fi

            if ! docker compose version &> /dev/null; then
              echo "Docker Compose plugin missing. Installing..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
              echo "Docker Compose installed successfully."
            else
              echo "Docker Compose is already available."
            fi

            echo "=== Step 2: Setting up Deployment Directory ==="
            APP_DIR="/home/${AZURE_VM_USERNAME}/api-gateway"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R ${AZURE_VM_USERNAME}:${AZURE_VM_USERNAME} "$APP_DIR"
            cd "$APP_DIR"

            echo "=== Step 3: Generating/Updating docker-compose.yml ==="
            cat <<EOF > docker-compose.yml
            services:
              api-gateway:
                image: ${AZURE_ACR_NAME}.azurecr.io/${AZURE_REPO_NAME}:prod
                container_name: api-gateway
                restart: unless-stopped
                ports:
                  - "8091:8091"
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - SERVER_PORT=8091
                  - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
                healthcheck:
                  test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8091/actuator/health || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 40s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "5"
            EOF

            # Remove leading indentation from generated compose file
            sed -i 's/^[ \t]*//' docker-compose.yml

            echo "=== Step 4: Authenticating to Azure Container Registry ==="
            echo "$AZURE_ACR_PASSWORD" | sudo docker login "${AZURE_ACR_NAME}.azurecr.io" -u "$AZURE_ACR_USERNAME" --password-stdin

            echo "=== Step 5: Pulling Latest Docker Image ==="
            sudo docker compose pull

            echo "=== Step 6: Deploying / Updating Application ==="
            sudo docker compose up -d --remove-orphans --force-recreate

            echo "=== Step 7: Cleaning up Unused Docker Images ==="
            sudo docker image prune -af

            echo "=== Step 8: Deployment Status & Container Logs ==="
            sudo docker compose ps
            echo "Waiting 5 seconds for initialization..."
            sleep 5
            sudo docker compose logs --tail=50
            echo "Deployment completed successfully!"
