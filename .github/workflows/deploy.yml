name: CI/CD Pipeline - Build & Deploy API Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_NAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/api-gateway:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vm:
    name: Deploy Container to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Azure VM and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            bash -c '
            echo "=== Step 1: Installing Docker if missing ==="
            if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER" 2>/dev/null || true
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            echo "=== Step 2: Preparing Application Directory ==="
            APP_DIR="$HOME/api-gateway"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "=== Step 3: Writing docker-compose.yml ==="
            cat <<EOF > docker-compose.yml
            services:
              api-gateway:
                image: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/api-gateway:prod
                container_name: api-gateway
                restart: unless-stopped
                ports:
                  - "8091:8091"
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - SERVER_PORT=8091
                  - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
                healthcheck:
                  test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8091/actuator/health || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 40s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "5"
            EOF

            sed -i "s/^[ \t]*//" docker-compose.yml

            echo "=== Step 4: Login to ACR from VM ==="
            echo "${{ secrets.AZURE_ACR_PASSWORD }}" | sudo docker login "${{ secrets.AZURE_ACR_NAME }}.azurecr.io" -u "${{ secrets.AZURE_ACR_NAME }}" --password-stdin

            echo "=== Step 5: Pulling Latest Image ==="
            sudo docker compose pull

            echo "=== Step 6: Starting Container ==="
            sudo docker compose up -d --remove-orphans --force-recreate

            echo "=== Step 7: Pruning Old Images ==="
            sudo docker image prune -af

            echo "=== Step 8: Checking Status ==="
            sudo docker compose ps
            echo "Recent container logs:"
            sleep 4
            sudo docker compose logs --tail=30
            echo "Deployment finished successfully!"
            '

