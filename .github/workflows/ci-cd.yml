name: CI/CD Pipeline - Azure AKS & ACR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APP_NAME: api-gateway
  IMAGE_NAME: api-gateway
  K8S_PATH: ./k8s

jobs:
  # ==========================================
  # 1. Continuous Integration (Build & Test)
  # ==========================================
  build-and-test:
    name: 🧪 Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔨 Build with Maven
        run: |
          mvn clean compile -B

      - name: 🧪 Run Unit Tests
        run: |
          mvn test -B

  # ==========================================
  # 2. Build & Push Docker Image to Azure ACR
  # ==========================================
  build-and-push-acr:
    name: 🐳 Build & Push to Azure ACR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔐 Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build and Push Docker Image
        run: |
          ACR_LOGIN_SERVER="${{ secrets.ACR_NAME }}.azurecr.io"
          IMAGE_URI="$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}"
          TAG="${{ github.sha }}"

          echo "Building Docker image: $IMAGE_URI:$TAG"
          docker build \
            -t "$IMAGE_URI:$TAG" \
            -t "$IMAGE_URI:latest" \
            .

          echo "Pushing images to ACR..."
          docker push "$IMAGE_URI:$TAG"
          docker push "$IMAGE_URI:latest"

  # ==========================================
  # 3. Continuous Deployment (Deploy to AKS)
  # ==========================================
  deploy-to-aks:
    name: 🚀 Deploy to Azure Kubernetes Service (AKS)
    runs-on: ubuntu-latest
    needs: build-and-push-acr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🎯 Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: 📝 Substitute Placeholders in K8s Manifests
        run: |
          sed -i "s|#{ACR_NAME}#|${{ secrets.ACR_NAME }}|g" ${{ env.K8S_PATH }}/deployment.yaml
          sed -i "s|#{IMAGE_TAG}#|${{ github.sha }}|g" ${{ env.K8S_PATH }}/deployment.yaml
          echo "Manifest preview:"
          cat ${{ env.K8S_PATH }}/deployment.yaml

      - name: ☸️ Deploy Manifests to AKS
        run: |
          kubectl apply -f ${{ env.K8S_PATH }}/configmap.yaml
          kubectl apply -f ${{ env.K8S_PATH }}/deployment.yaml
          kubectl apply -f ${{ env.K8S_PATH }}/service.yaml
          kubectl apply -f ${{ env.K8S_PATH }}/hpa.yaml

      - name: ⏳ Verify Rollout Status
        run: |
          kubectl rollout status deployment/api-gateway --timeout=180s
          kubectl get pods -l app=api-gateway
          kubectl get svc api-gateway
          kubectl get hpa api-gateway-hpa
